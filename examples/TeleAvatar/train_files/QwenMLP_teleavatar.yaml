# Mirror of starVLA/config/training/QwenMLP_teleavatar.yaml.
# The run script uses the config under starVLA/config/training/.

run_id: starvla_teleavatar_pick_marker
run_root_dir: results/Checkpoints
seed: 42
trackers: [jsonl, wandb]
wandb_entity: your_wandb_entity
wandb_project: starvla_teleavatar
is_debug: false

framework:
  name: QwenOFT
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3-VL-4B-Instruct
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2560
  action_model:
    action_model_type: MLP
    action_dim: 20
    state_dim: 18
    action_horizon: 30
    future_action_window_size: 15
    past_action_window_size: 0
  obs_image_size: [224, 224]
  reduce_in_full_precision: true

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: .
    data_mix: teleavatar_pick_marker
    action_type: abs_ee
    action_mode: abs
    CoT_prompt: "Your task is {instruction}. Complete the task step by step."
    default_image_resolution: [3, 224, 224]
    image_size: [224, 224]
    per_device_batch_size: 8
    load_all_data_for_training: true
    obs: ["left_color", "right_color", "chest_camera"]
    video_backend: torchvision_av

trainer:
  max_train_steps: 30000
  num_warmup_steps: 1000
  save_interval: 5000
  eval_interval: 500
  logging_frequency: 10

  learning_rate:
    base: 1.0e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04

  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06

  freeze_modules: ""
  loss_scale:
    vla: 1.0
    vlm: 0.0

  max_grad_norm: 1.0
  warmup_ratio: 0.05
  weight_decay: 0.0
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08

  save_format: pt
  is_resume: false
  resume_from_checkpoint: null
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true
